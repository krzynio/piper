[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pltts"
version = "0.1.1"
description = "Polish TTS (Piper VITS) with a corrected phoneme frontend: trz/drz, acronyms, Roman numerals, English words"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "onnxruntime>=1.15",
    # The original piper-phonemize ships Linux wheels only up to cp310, so on a
    # current interpreter it cannot be installed at all. Both forks below expose
    # the same `piper_phonemize` module and were checked to return byte-identical
    # phonemes to 1.1.0 on 814 phonemizations — which matters, because different
    # phonemes would not line up with the ids the model was trained on.
    "piper-phonemize-fix>=1.2.2; python_version >= '3.10'",
    "piper-phonemize-cross>=1.2.1; python_version < '3.10'",
]

readme = "README.md"

[project.scripts]
pltts = "pltts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pltts"]

# The model and the language-detector tables are data, not code, so they have to
# be named explicitly or the wheel ships without them and every call fails.
[tool.hatch.build.targets.wheel.force-include]
"src/pltts/models/pl_multi.onnx" = "pltts/models/pl_multi.onnx"
"src/pltts/models/pl_multi.onnx.json" = "pltts/models/pl_multi.onnx.json"

[tool.hatch.build]
artifacts = ["*.onnx", "*.onnx.json", "*.bin", "*.bloom"]
